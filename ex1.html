
<!DOCTYPE html>
<html>
<head>
    <title>Library Management System</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f0f4f8;
        }
        h1 { color: navy; }
        input, button {
            padding: 10px;
            margin: 5px;
        }
        button {
            background: navy;
            color: white;
            border: none;
        }
    </style>
</head>
<body>

<h1>Library Management System</h1>

<h3>User Login</h3>
<input id="username" placeholder="Enter username">
<button onclick="login()">Login</button>

<h3>Search Books</h3>
<input id="search" placeholder="Enter book name">
<button onclick="searchBook()">Search</button>
<p id="result"></p>

<h3>Admin - Add Book</h3>
<input id="book" placeholder="Enter book name">
<button onclick="addBook()">Add Book</button>

<h3>Available Books</h3>
<ul id="books"></ul>

<script>
let library = ["Java", "Python", "Web Technology"];

function showBooks() {
    document.getElementById("books").innerHTML =
        library.map(book => `<li>${book}</li>`).join("");
}

function login() {
    let name = document.getElementById("username").value;
    alert(name ? "Welcome " + name : "Enter username");
}

function searchBook() {
    let name = document.getElementById("search").value.toLowerCase();
    let found = library.filter(book =>
        book.toLowerCase().includes(name));
    document.getElementById("result").innerText =
        found.length ? found.join(", ") : "Book not found";
}

function addBook() {
    let name = document.getElementById("book").value;
    if (name) {
        library.push(name);
        showBooks();
        document.getElementById("book").value = "";
    }
}

showBooks();
</script>

</body>
</html>
