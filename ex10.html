
<!DOCTYPE html>
<html>
<head>
    <title>StyleHub Fashion Store</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }
        header {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }
        nav {
            background: #e91e63;
            padding: 12px;
            text-align: center;
        }
        nav a {
            color: white;
            margin: 15px;
            text-decoration: none;
        }
        .search {
            text-align: center;
            margin: 20px;
        }
        input, select {
            padding: 10px;
            margin: 5px;
        }
        .products {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
        }
        .product {
            background: white;
            padding: 15px;
            width: 200px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 5px #ccc;
        }
        .product img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }
        button {
            background: #e91e63;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background: #ad1457;
        }
        #cart {
            background: white;
            margin: 20px;
            padding: 20px;
        }
        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>
<body>

<header>
    <h1>StyleHub</h1>
    <p>Your Fashion, Your Style!</p>
</header>

<nav>
    <a href="#home">Home</a>
    <a href="#products">Products</a>
    <a href="#cart">Shopping Cart</a>
    <a href="#login">Login</a>
</nav>

<section id="home">
    <div class="search">
        <h2>Find Your Fashion</h2>
        <input type="text" id="search"
               placeholder="Search products..."
               oninput="showProducts()">

        <select id="category" onchange="showProducts()">
            <option value="All">All Categories</option>
            <option value="Men">Men</option>
            <option value="Women">Women</option>
            <option value="Kids">Kids</option>
            <option value="Footwear">Footwear</option>
        </select>
    </div>
</section>

<h2 style="text-align:center" id="products">Our Products</h2>
<div class="products" id="productList"></div>

<section id="cart">
    <h2>Shopping Cart</h2>
    <div id="cartItems">Your cart is empty.</div>
    <h3 id="total">Total: ₹0</h3>
    <button onclick="checkout()">Checkout</button>
</section>

<section id="login" style="text-align:center; padding:20px">
    <h2>Customer Login</h2>
    <input type="email" id="email" placeholder="Email address">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
</section>

<footer>
    <p>&copy; 2026 StyleHub Fashion Store</p>
</footer>

<script>
const products = [
    {name:"Men's T-Shirt", price:599, category:"Men",
     image:"https://placehold.co/300x200?text=Mens+Tshirt"},
    {name:"Women's Dress", price:1299, category:"Women",
     image:"https://placehold.co/300x200?text=Womens+Dress"},
    {name:"Kids Wear", price:499, category:"Kids",
     image:"https://placehold.co/300x200?text=Kids+Wear"},
    {name:"Sports Shoes", price:1599, category:"Footwear",
     image:"https://placehold.co/300x200?text=Sports+Shoes"}
];

let cart = [];

function showProducts() {
    const search = document.getElementById("search").value.toLowerCase();
    const category = document.getElementById("category").value;
    const list = document.getElementById("productList");

    list.innerHTML = "";

    products.forEach((p, i) => {
        if (p.name.toLowerCase().includes(search) &&
            (category === "All" || p.category === category)) {
            list.innerHTML += `
                <div class="product">
                    <img src="${p.image}" alt="${p.name}">
                    <h3>${p.name}</h3>
                    <p>Price: ₹${p.price}</p>
                    <button onclick="addToCart(${i})">
                        Add to Cart
                    </button>
                </div>`;
        }
    });

    if (list.innerHTML === "") {
        list.innerHTML = "<p>No products found.</p>";
    }
}

function addToCart(index) {
    cart.push(products[index]);
    updateCart();
}

function removeItem(index) {
    cart.splice(index, 1);
    updateCart();
}

function updateCart() {
    const items = document.getElementById("cartItems");
    let total = 0;

    if (cart.length === 0) {
        items.innerHTML = "Your cart is empty.";
    } else {
        items.innerHTML = cart.map((p, i) => {
            total += p.price;
            return `<p>${p.name} - ₹${p.price}
                <button onclick="removeItem(${i})">Remove</button>
            </p>`;
        }).join("");
    }

    document.getElementById("total").innerText =
        "Total: ₹" + total;
}

function checkout() {
    if (cart.length === 0) {
        alert("Your cart is empty!");
    } else {
        alert("Order placed successfully! Total: ₹" +
            cart.reduce((sum, p) => sum + p.price, 0));
        cart = [];
        updateCart();
    }
}

function login() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (email === "" || password === "") {
        alert("Please enter email and password.");
    } else {
        alert("Demo login successful!");
    }
}

showProducts();
</script>

</body>
</html>
