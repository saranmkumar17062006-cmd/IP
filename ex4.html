
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Train Reservation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            margin: 0;
        }

        header {
            background: #123b65;
            color: white;
            text-align: center;
            padding: 20px;
        }

        nav {
            background: #1d5b91;
            padding: 12px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 12px;
        }

        .container {
            background: white;
            max-width: 650px;
            margin: 25px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ccc;
        }

        h2 {
            color: #123b65;
            text-align: center;
        }

        input, select, button {
            width: 100%;
            padding: 11px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            background: #123b65;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #1d5b91;
        }

        #result {
            background: #e5f5e9;
            padding: 15px;
            margin-top: 15px;
            overflow-wrap: anywhere;
        }

        footer {
            text-align: center;
            padding: 15px;
            background: #123b65;
            color: white;
        }

        @media (max-width: 600px) {
            .container {
                margin: 15px;
                padding: 18px;
            }

            nav a {
                display: inline-block;
                margin: 6px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🚆 Train Reservation System</h1>
    <p>Book Your Train Tickets Online</p>
</header>

<nav>
    <a href="#search">Search Trains</a>
    <a href="#booking">Book Ticket</a>
    <a href="#pnr">PNR Status</a>
    <a href="#cancel">Cancel Ticket</a>
</nav>

<div class="container" id="search">
    <h2>Search Trains</h2>

    <form id="searchForm">
        <input type="text" id="from"
               placeholder="Origin Station" required>

        <input type="text" id="to"
               placeholder="Destination Station" required>

        <input type="date" id="journeyDate" required>

        <select id="classType">
            <option value="Sleeper">Sleeper</option>
            <option value="AC 3 Tier">AC 3 Tier</option>
            <option value="AC 2 Tier">AC 2 Tier</option>
            <option value="General">General</option>
        </select>

        <button type="submit">Search Trains</button>
    </form>

    <div id="trainResults"></div>
</div>

<div class="container" id="booking">
    <h2>Book Your Ticket</h2>

    <form id="bookingForm">
        <input type="text" id="passenger"
               placeholder="Passenger Name" required>

        <input type="number" id="age"
               placeholder="Passenger Age" min="1" max="120" required>

        <input type="text" id="trainName"
               placeholder="Train Name" required>

        <input type="text" id="source"
               placeholder="Origin Station" required>

        <input type="text" id="destination"
               placeholder="Destination Station" required>

        <input type="date" id="date" required>

        <select id="travelClass">
            <option>Sleeper</option>
            <option>AC 3 Tier</option>
            <option>AC 2 Tier</option>
            <option>General</option>
        </select>

        <button type="submit">Book Ticket</button>
    </form>

    <div id="ticket"></div>
    <button id="printButton" hidden onclick="window.print()">
        Print Ticket
    </button>
</div>

<div class="container" id="pnr">
    <h2>Check PNR Status</h2>

    <input type="text" id="pnrInput"
           placeholder="Enter PNR Number">

    <button onclick="checkPNR()">Check Status</button>

    <div id="pnrResult"></div>
</div>

<div class="container" id="cancel">
    <h2>Cancel Ticket</h2>

    <input type="text" id="cancelPNR"
           placeholder="Enter PNR Number">

    <button onclick="cancelTicket()">Cancel Ticket</button>

    <div id="cancelResult"></div>
</div>

<footer>
    <p>Online Train Reservation System</p>
</footer>

<script>
    // Sample train data
    const trains = [
        {
            name: "Chennai Express",
            number: "12601",
            from: "Chennai",
            to: "Bangalore",
            seats: 50
        },
        {
            name: "Coimbatore Express",
            number: "12675",
            from: "Chennai",
            to: "Coimbatore",
            seats: 35
        },
        {
            name: "Pandian Express",
            number: "12637",
            from: "Chennai",
            to: "Madurai",
            seats: 40
        }
    ];

    const reservations = {};

    document.getElementById("journeyDate").min =
        new Date().toLocaleDateString("en-CA");

    document.getElementById("date").min =
        new Date().toLocaleDateString("en-CA");

    document.getElementById("searchForm").addEventListener(
        "submit", function(event) {
            event.preventDefault();

            const from = document.getElementById("from").value.trim();
            const to = document.getElementById("to").value.trim();
            const date = document.getElementById("journeyDate").value;
            const selectedClass = document.getElementById("classType").value;

            const matches = trains.filter(train =>
                train.from.toLowerCase() === from.toLowerCase() &&
                train.to.toLowerCase() === to.toLowerCase()
            );

            const results = document.getElementById("trainResults");

            if (!matches.length) {
                results.innerHTML = "<p>No sample trains found for this route.</p>";
                return;
            }

            results.innerHTML = matches.map(train => `
                <div>
                    <h3>${train.name} (${train.number})</h3>
                    <p>${train.from} → ${train.to}</p>
                    <p>Date: ${date}</p>
                    <p>Class: ${selectedClass}</p>
                    <p>Sample available seats: ${train.seats}</p>
                    <button onclick="fillBooking('${train.name}',
                    '${train.from}', '${train.to}', '${date}',
                    '${selectedClass}')">Select Train</button>
                </div>
                <hr>
            `).join("");
        }
    );

    function fillBooking(name, from, to, date, travelClass) {
        document.getElementById("trainName").value = name;
        document.getElementById("source").value = from;
        document.getElementById("destination").value = to;
        document.getElementById("date").value = date;
        document.getElementById("travelClass").value = travelClass;

        document.getElementById("booking").scrollIntoView();
    }

    document.getElementById("bookingForm").addEventListener(
        "submit", function(event) {
            event.preventDefault();

            const pnr = String(Math.floor(1000000000 +
                Math.random() * 9000000000));

            const passenger = document.getElementById("passenger").value;
            const age = document.getElementById("age").value;
            const train = document.getElementById("trainName").value;
            const from = document.getElementById("source").value;
            const to = document.getElementById("destination").value;
            const date = document.getElementById("date").value;
            const travelClass = document.getElementById("travelClass").value;

            reservations[pnr] = {
                passenger, age, train, from, to, date,
                travelClass, status: "Confirmed"
            };

            document.getElementById("ticket").innerHTML = `
                <h3>Ticket Booked Successfully!</h3>
                <p><b>PNR Number:</b> ${pnr}</p>
                <p><b>Passenger:</b> ${passenger}</p>
                <p><b>Age:</b> ${age}</p>
                <p><b>Train:</b> ${train}</p>
                <p><b>Route:</b> ${from} → ${to}</p>
                <p><b>Journey Date:</b> ${date}</p>
                <p><b>Class:</b> ${travelClass}</p>
                <p><b>Status:</b> Confirmed</p>
                <p><b>Fare:</b> Demo booking - no payment processed</p>
            `;

            document.getElementById("printButton").hidden = false;
        }
    );

    function checkPNR() {
        const pnr = document.getElementById("pnrInput").value.trim();
        const reservation = reservations[pnr];

        document.getElementById("pnrResult").textContent =
            reservation
            ? "PNR: " + pnr + " | Status: " + reservation.status
            : "PNR not found. Check the number in this browser session.";
    }

    function cancelTicket() {
        const pnr = document.getElementById("cancelPNR").value.trim();
        const reservation = reservations[pnr];
        const result = document.getElementById("cancelResult");

        if (!reservation) {
            result.textContent = "PNR not found.";
            return;
        }

        if (reservation.status === "Cancelled") {
            result.textContent = "This ticket is already cancelled.";
            return;
        }

        reservation.status = "Cancelled";
        result.textContent =
            "Ticket cancelled successfully. Refund processing is not available in this demo.";
    }
</script>

</body>
</html>
